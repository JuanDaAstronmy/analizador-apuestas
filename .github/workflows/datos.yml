# Copia los CSV de football-data.co.uk a una "release" de este repositorio.
# En algunas redes (p. ej. en Colombia) ese sitio está bloqueado; la app
# descarga primero esta copia desde GitHub y solo si falla va al sitio original.
name: Actualizar datos

on:
  schedule:
    - cron: '23 11 * * 1,3,5'   # lunes, miércoles y viernes (06:23 en Colombia)
  workflow_dispatch:            # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: ['.github/workflows/datos.yml']

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar CSV
        run: |
          mkdir -p datos && cd datos
          y=$(date -u +%Y); m=$(date -u +%-m)
          if [ "$m" -ge 7 ]; then start=$y; else start=$((y-1)); fi
          ok=0
          get() { # $1 = ruta en football-data.co.uk
            name=$(echo "$1" | tr '/' '_')
            if curl -fsSL --retry 3 --max-time 120 -o "$name" "https://football-data.co.uk/$1"; then ok=$((ok+1)); echo "ok  $1"; else rm -f "$name"; echo "--  $1"; fi
          }
          for i in 0 1 2; do
            s=$(printf '%02d%02d' $(( (start-i) % 100 )) $(( (start-i+1) % 100 )))
            for lg in E0 SP1 I1 D1 F1 N1 P1 E1 T1; do get "mmz4281/$s/$lg.csv"; done
          done
          for lg in ARG BRA MEX USA; do get "new/$lg.csv"; done
          get fixtures.csv
          get new_league_fixtures.csv
          echo "Archivos descargados: $ok"
          [ "$ok" -ge 10 ]
      - name: Publicar en la release "datos"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view datos >/dev/null 2>&1 || \
            gh release create datos --title "Datos de partidos" --latest=false \
              --notes "Copia automática de football-data.co.uk (se actualiza sola). No borrar: la app la usa."
          gh release upload datos datos/*.csv --clobber
